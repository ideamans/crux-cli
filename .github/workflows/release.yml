name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # PluginVersion feeds the Claude Code plugin manifest, which users install
      # independently of the binary. A tag that disagrees with it would publish
      # a plugin claiming the wrong version.
      - name: Verify the tag matches PluginVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE 'PluginVersion = "[^"]+"' cmd/crux/main.go | cut -d'"' -f2)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with PluginVersion ($declared) in cmd/crux/main.go"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
